name: Sync Bulletin & Live Scores

on:
  schedule:
    # Her 6 saatte bir (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Sync Data
        env:
          NOSYAPI_KEY: ${{ secrets.NOSYAPI_KEY }}
          BULLETIN_API_URL: ${{ secrets.BULLETIN_API_URL }}
          LIVE_SCORES_API_URL: ${{ secrets.LIVE_SCORES_API_URL }}
        run: npm run sync:data

      - name: Commit & Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bulletin/current.json public/live/scores.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-sync bulletin and live scores [skip ci]"
            git push
          fi
