<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Hedef15 Pro Oynatıcı</title>
  <style>
    body {
      width: 320px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0B0F19;
      color: #F3F4F6;
      margin: 0;
      padding: 16px;
    }
    h3 {
      margin: 0 0 10px 0;
      color: #10B981;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: #1F2937;
      color: #FFF;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 12px;
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      width: 100%;
      background: #10B981;
      color: #FFF;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background: #059669;
    }
    .status {
      font-size: 11px;
      color: #9CA3AF;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>🎯 Hedef15 Pro Oynatıcı</h3>
  <p style="font-size: 12px; margin: 0 0 8px 0; color: #9CA3AF;">Extra1X2 TXT formatındaki kolonları buraya yapıştırın ve Oyna butonuna basın:</p>
  <textarea id="txtColumns" placeholder="11X21X1211X1221&#10;1X121X1211X1221..."></textarea>
  <button id="btnPlay">Kupona Otomatik Doldur</button>
  <div id="status" class="status">Hazır</div>
  <script src="popup.js"></script>
</body>
</html>
